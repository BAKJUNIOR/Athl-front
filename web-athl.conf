server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Fichiers de traduction : URL identique à chaque déploiement (pas de hash comme les
    # bundles JS/CSS), donc sans ceci le navigateur peut continuer à servir une version mise
    # en cache après un déploiement — les nouvelles clés i18n restent alors invisibles tant
    # qu'on ne vide pas le cache à la main.
    location /i18n/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

}