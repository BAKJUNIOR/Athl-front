<section class="phero">
  <div class="phero__eyebrow" appReveal>{{ 'services.eyebrow' | transloco }}</div>
  <h1 [appReveal]="80">{{ 'services.title' | transloco }}</h1>
  <p [appReveal]="160">{{ 'services.subtitle' | transloco }}</p>
</section>

<section class="svc-list">
  @for (service of services(); track service.slug; let i = $index) {
    <article class="svc" [appReveal]="60 + i * 80">
      <div class="svc__media"><img [src]="service.image" [alt]="service.title" loading="lazy" /></div>
      <div class="svc__body">
        <div class="svc__num">{{ service.number }}</div>
        <h2>{{ service.title }}</h2>
        <p class="lead">{{ service.lead }}</p>
        <a class="btn btn--light" [routerLink]="['/services', service.slug]">{{ 'common.learnMore' | transloco }}</a>
      </div>
    </article>
  }
</section>

<app-cta-banner appReveal [title]="'common.cta.needAdviceTitle' | transloco" [text]="'common.cta.contactUs' | transloco" [showPhones]="true" [showActions]="false" />
